<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Όχημα')}"></head>
<body>
	<nav th:replace="~{fragments/header :: header('')}"></nav>

	<!-- One field. The error comes from VehicleService, keyed by the DTO field
	     name; what was typed stays in the input. -->
	<div th:fragment="field(name, label, type, value)" class="col-md-4">
		<label class="form-label" th:for="${name}" th:text="${label}">Ετικέτα</label>
		<input class="form-control" th:type="${type}" th:id="${name}" th:name="${name}" th:value="${value}"
			th:step="${type == 'number'} ? 'any'"
			th:classappend="${errors != null and errors.containsKey(name)} ? 'is-invalid'">
		<div class="invalid-feedback" th:if="${errors != null and errors.containsKey(name)}"
			th:text="${errors.get(name)}">Μήνυμα</div>
	</div>

	<!-- One dropdown of Greek enum values (DATA_MODEL). -->
	<div th:fragment="choice(name, label, values, selected)" class="col-md-4">
		<label class="form-label" th:for="${name}" th:text="${label}">Ετικέτα</label>
		<select class="form-select" th:id="${name}" th:name="${name}"
			th:classappend="${errors != null and errors.containsKey(name)} ? 'is-invalid'">
			<option value="">—</option>
			<option th:each="value : ${values}" th:value="${value}" th:text="${value}"
				th:selected="${value.name() == selected}">ΕΙΧ</option>
		</select>
		<div class="invalid-feedback" th:if="${errors != null and errors.containsKey(name)}"
			th:text="${errors.get(name)}">Μήνυμα</div>
	</div>

	<main class="container" th:with="v=${vehicle}, isNew=${vehicle.id == null}">
		<h1 class="h3 mb-3" th:text="${isNew} ? 'Νέο όχημα' : 'Επεξεργασία οχήματος'">Νέο όχημα</h1>

		<div class="alert alert-warning" th:if="${conflict != null}" th:text="${conflict}">Σύγκρουση</div>
		<div class="alert alert-danger" th:if="${problems != null and !problems.isEmpty()}">
			<p class="mb-0" th:each="problem : ${problems}" th:text="${problem}">Πρόβλημα</p>
		</div>

		<form method="post" th:action="${isNew} ? @{/vehicles} : @{/vehicles/{id}(id=${v.id})}">
			<!-- Optimistic locking (Task 7): the version the clerk started from. -->
			<input type="hidden" name="version" th:value="${v.version}">
			<input type="hidden" name="id" th:value="${v.id}">

			<!-- The same sections and licence codes as the card (SPEC §7.2). -->
			<h2 class="h5 mt-3">Ταυτότητα</h2>
			<div class="row g-3">
				<div th:replace="~{this :: field('plate', 'Αρ. Κυκλοφορίας (A) *', 'text', ${v.plate})}"></div>
				<div th:replace="~{this :: field('vin', 'Αρ. Πλαισίου / VIN (E) *', 'text', ${v.vin})}"></div>
				<div th:replace="~{this :: field('brand', 'Μάρκα (D.1) *', 'text', ${v.brand})}"></div>
				<div th:replace="~{this :: field('model', 'Μοντέλο (D.3) *', 'text', ${v.model})}"></div>
				<div th:replace="~{this :: field('firstRegistration', '1η Άδεια (B) *', 'date', ${v.firstRegistration})}"></div>
				<div th:replace="~{this :: field('licenseIssueDate', 'Έκδοση (I)', 'date', ${v.licenseIssueDate})}"></div>
			</div>

			<h2 class="h5 mt-4">Τεχνικά</h2>
			<div class="row g-3">
				<div th:replace="~{this :: field('category', 'Κατηγορία (J) *', 'text', ${v.category})}"></div>
				<div th:replace="~{this :: choice('usageType', 'Χρήση Οχήματος *', ${usageTypes}, ${v.usageType})}"></div>
				<div th:replace="~{this :: field('color', 'Χρώμα (R) *', 'text', ${v.color})}"></div>
				<div th:replace="~{this :: field('seats', 'Θέσεις (S.1)', 'number', ${v.seats})}"></div>
				<div th:replace="~{this :: choice('fuelType', 'Καύσιμο (P.3) *', ${fuelTypes}, ${v.fuelType})}"></div>
				<div th:replace="~{this :: field('engineCc', 'Κυβικά (P.1)', 'number', ${v.engineCc})}"></div>
				<div th:replace="~{this :: field('powerKw', 'Ισχύς kW (P.2) *', 'number', ${v.powerKw})}"></div>
				<div th:replace="~{this :: field('engineNumber', 'Αρ. Κινητήρα (P.5)', 'text', ${v.engineNumber})}"></div>
				<div th:replace="~{this :: field('co2', 'CO2 (V.7)', 'number', ${v.co2})}"></div>
				<div th:replace="~{this :: field('emissionStandard', 'Euro (V.9)', 'text', ${v.emissionStandard})}"></div>
				<div th:replace="~{this :: field('weightKg', 'Βάρος kg (G)', 'number', ${v.weightKg})}"></div>
				<p class="text-body-secondary small mb-0">
					Τα κυβικά μένουν κενά μόνο σε ηλεκτρικό όχημα.
				</p>
			</div>

			<h2 class="h5 mt-4">Διεύθυνση άδειας</h2>
			<p class="text-body-secondary small">
				Αντίγραφο της διεύθυνσης όπως είναι τυπωμένη στην άδεια (C.1.3). Δεν αλλάζει μαζί με τη
				διεύθυνση του ιδιοκτήτη.
			</p>
			<div class="row g-3">
				<div th:replace="~{this :: field('licenseStreet', 'Οδός (C.1.3)', 'text', ${v.licenseStreet})}"></div>
				<div th:replace="~{this :: field('licenseCity', 'Πόλη', 'text', ${v.licenseCity})}"></div>
				<div th:replace="~{this :: field('licensePostalCode', 'Τ.Κ.', 'text', ${v.licensePostalCode})}"></div>
			</div>

			<div class="d-flex gap-2 mt-4">
				<button class="btn btn-primary" type="submit">Αποθήκευση</button>
				<a class="btn btn-outline-secondary" th:href="${isNew} ? @{/} : @{/vehicles/{id}(id=${v.id})}">Άκυρο</a>
			</div>
		</form>
	</main>
</body>
</html>
