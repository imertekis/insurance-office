<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Όχημα')}"></head>
<body>
	<nav th:replace="~{fragments/header :: header('')}"></nav>

	<main class="container" th:with="v=${vehicle}, isNew=${vehicle.id == null}">
		<h1 class="h3 mb-3" th:text="${isNew} ? 'Νέο όχημα' : 'Επεξεργασία οχήματος'">Νέο όχημα</h1>

		<div class="alert alert-warning" th:if="${conflict != null}" th:text="${conflict}">Σύγκρουση</div>
		<div class="alert alert-danger" th:if="${problems != null and !problems.isEmpty()}">
			<p class="mb-0" th:each="problem : ${problems}" th:text="${problem}">Πρόβλημα</p>
		</div>

		<!-- data-warn-unsaved: leaving with changes not saved asks first (Task 16f-2, app.js). -->
		<form method="post" th:action="${isNew} ? @{/vehicles} : @{/vehicles/{id}(id=${v.id})}" data-warn-unsaved>
			<!-- Optimistic locking (Task 7): the version the clerk started from. -->
			<input type="hidden" name="version" th:value="${v.version}">
			<input type="hidden" name="id" th:value="${v.id}">

			<!-- The same sections and licence codes as the card (SPEC §7.2),
			     each in a card of its own (Task 16d-1). -->
			<section class="card form-section">
				<div class="card-header"><h2>Ταυτότητα</h2></div>
				<div class="card-body">
					<div class="row g-3">
						<!-- In capitals while typed, as they are stored (Task 17). -->
						<div th:replace="~{fragments/form-fields :: field('plate', 'Αρ. Κυκλοφορίας (A) *', 'uppercase', ${v.plate}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('vin', 'Αρ. Πλαισίου / VIN (E) *', 'uppercase', ${v.vin}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('brand', 'Μάρκα (D.1) *', 'text', ${v.brand}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('model', 'Μοντέλο (D.3) *', 'text', ${v.model}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('firstRegistration', '1η Άδεια (B) *', 'date', ${v.firstRegistration}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('licenseIssueDate', 'Έκδοση (I)', 'date', ${v.licenseIssueDate}, 'col-md-4')}"></div>
					</div>
				</div>
			</section>

			<section class="card form-section">
				<div class="card-header"><h2>Τεχνικά</h2></div>
				<div class="card-body">
					<div class="row g-3">
						<div th:replace="~{fragments/form-fields :: field('category', 'Κατηγορία (J) *', 'text', ${v.category}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: choice('usageType', 'Χρήση Οχήματος *', ${usageTypes}, ${v.usageType}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('color', 'Χρώμα (R) *', 'text', ${v.color}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('seats', 'Θέσεις (S.1)', 'integer', ${v.seats}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: choice('fuelType', 'Καύσιμο (P.3) *', ${fuelTypes}, ${v.fuelType}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: fieldWithHint('engineCc', 'Κυβικά (P.1)', 'integer', ${v.engineCc}, 'col-md-4',
							'Τα κυβικά μένουν κενά μόνο σε ηλεκτρικό όχημα.')}"></div>
						<!-- "12,5" or "12.5": VehicleController reads both. -->
						<div th:replace="~{fragments/form-fields :: field('powerKw', 'Ισχύς kW (P.2) *', 'decimal', ${v.powerKw}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('engineNumber', 'Αρ. Κινητήρα (P.5)', 'text', ${v.engineNumber}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('co2', 'CO2 (V.7)', 'integer', ${v.co2}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('emissionStandard', 'Euro (V.9)', 'text', ${v.emissionStandard}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('weightKg', 'Βάρος kg (G)', 'integer', ${v.weightKg}, 'col-md-4')}"></div>
					</div>
				</div>
			</section>

			<section class="card form-section">
				<div class="card-header"><h2>Διεύθυνση άδειας</h2></div>
				<div class="card-body">
					<div class="row g-3">
						<p class="col-12 text-body-secondary small mb-0">
							Αντίγραφο της διεύθυνσης όπως είναι τυπωμένη στην άδεια (C.1.3). Δεν αλλάζει μαζί με τη
							διεύθυνση του ιδιοκτήτη.
						</p>
						<div th:replace="~{fragments/form-fields :: field('licenseStreet', 'Οδός (C.1.3)', 'text', ${v.licenseStreet}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('licenseCity', 'Πόλη', 'text', ${v.licenseCity}, 'col-md-4')}"></div>
						<div th:replace="~{fragments/form-fields :: field('licensePostalCode', 'Τ.Κ.', 'text', ${v.licensePostalCode}, 'col-md-4')}"></div>
					</div>
				</div>
			</section>

			<div class="d-flex gap-2">
				<button class="btn btn-primary" type="submit">Αποθήκευση</button>
				<a class="btn btn-outline-secondary" th:href="${isNew} ? @{/} : @{/vehicles/{id}(id=${v.id})}">Άκυρο</a>
			</div>
		</form>
	</main>
	<div th:replace="~{layout :: dateScripts}"></div>
</body>
</html>
