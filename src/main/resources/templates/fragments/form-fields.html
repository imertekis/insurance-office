<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<body>
	<!-- One field, shared by the customer, vehicle and policy forms (Tasks
	     11a/11b/11d). Lives in its own file, not local to a form template, so
	     it is only ever rendered where it is called with th:replace, never a
	     second time in place of the page that declares it (Task 16a). The
	     error comes from the service, keyed by the DTO field name; what was
	     typed stays in the input.
	     Every field is type="text"; the type named here only changes how it
	     is shown and typed (Task 16d-1):
	     - 'date': picked up by the flatpickr date picker
	       (static/js/date-picker.js) through the "js-date" class. The display
	       becomes dd/MM/yyyy but the value submitted stays ISO. The
	       placeholder is copied by flatpickr to the input the clerk sees.
	     - 'integer' / 'decimal': a number, without the browser's spinner
	       arrows, opening the phone's number keypad (inputmode). A word is
	       no longer blocked by the browser; the controller answers it with a
	       message beside the field (FormErrors).
	     - 'uppercase': shown in capitals while typed, as the server stores
	       it (Task 17); CSS only, the letters stay in their own alphabet.
	     Thymeleaf passes fragment arguments by position, so field(...) has
	     no hint: it is fieldWithHint(...) without one, not a second copy. -->
	<div th:fragment="field(name, label, type, value, colClass)"
		th:replace="~{fragments/form-fields :: fieldWithHint(${name}, ${label}, ${type}, ${value}, ${colClass}, null)}"></div>

	<!-- The same field with a line of help under it (Task 16f-1), e.g. when
	     Κυβικά may stay empty. The error, when there is one, stays right
	     under the input as on every field, and the hint follows; the input
	     names the hint in aria-describedby, so a screen reader reads it. -->
	<div th:fragment="fieldWithHint(name, label, type, value, colClass, hint)" th:class="${colClass}">
		<label class="form-label" th:for="${name}" th:text="${label}">Ετικέτα</label>
		<input class="form-control" type="text" th:id="${name}" th:name="${name}" th:value="${value}"
			th:attr="inputmode=${type == 'integer'} ? 'numeric' : (${type == 'decimal'} ? 'decimal' : null),
				aria-describedby=${hint != null} ? |${name}-hint| : null"
			th:placeholder="${type == 'date'} ? 'ηη/μμ/εεεε'"
			th:classappend="${(type == 'date' ? 'js-date ' : '') + (type == 'uppercase' ? 'text-uppercase ' : '') + (errors != null and errors.containsKey(name) ? 'is-invalid' : '')}">
		<div class="invalid-feedback" th:if="${errors != null and errors.containsKey(name)}"
			th:text="${errors.get(name)}">Μήνυμα</div>
		<div class="form-text" th:if="${hint != null}" th:id="|${name}-hint|" th:text="${hint}">Οδηγία</div>
	</div>

	<!-- One dropdown of Greek enum values (DATA_MODEL), shared the same way. -->
	<div th:fragment="choice(name, label, values, selected, colClass)" th:class="${colClass}">
		<label class="form-label" th:for="${name}" th:text="${label}">Ετικέτα</label>
		<select class="form-select" th:id="${name}" th:name="${name}"
			th:classappend="${errors != null and errors.containsKey(name)} ? 'is-invalid'">
			<option value="">—</option>
			<option th:each="value : ${values}" th:value="${value}" th:text="${value}"
				th:selected="${value.name() == selected}">ΕΙΧ</option>
		</select>
		<div class="invalid-feedback" th:if="${errors != null and errors.containsKey(name)}"
			th:text="${errors.get(name)}">Μήνυμα</div>
	</div>

	<!-- Task 23b: one value of a list of Task 23a (VehicleValues), with the
	     empty first choice «— Επιλέξτε —». A value from before the list, or
	     imported from outside it, comes first instead, selected, marked
	     «(εκτός λίστας)», with the note below: it is saved again as it is
	     while left alone (Task 23, decision 7). A value is outside the list when it is
	     not among the values; a new one never gets that far, because the
	     server refuses it with a message, which then takes the note's place. -->
	<div th:fragment="listChoice(name, label, values, selected, colClass)" th:class="${colClass}"
		th:with="refused=${errors != null and errors.containsKey(name)},
			outside=${!#strings.isEmpty(selected) and !#lists.contains(values, selected)}">
		<label class="form-label" th:for="${name}" th:text="${label}">Ετικέτα</label>
		<select class="form-select" th:id="${name}" th:name="${name}"
			th:attr="aria-describedby=${outside and !refused} ? |${name}-outside| : null"
			th:classappend="${refused} ? 'is-invalid'">
			<option th:if="${outside}" th:value="${selected}" th:text="|${selected} (εκτός λίστας)|"
				selected>ΛΑΔΙ (εκτός λίστας)</option>
			<option value="">— Επιλέξτε —</option>
			<option th:each="value : ${values}" th:value="${value}" th:text="${value}"
				th:selected="${value == selected}">Λευκό</option>
		</select>
		<div class="invalid-feedback" th:if="${refused}" th:text="${errors.get(name)}">Μήνυμα</div>
		<th:block th:if="${outside and !refused}">
			<div th:replace="~{fragments/form-fields :: outsideNote(${name})}"></div>
		</th:block>
	</div>

	<!-- The note under a value outside its list (Task 23b), shared with the
	     brand field of the vehicle form; the field names it in
	     aria-describedby="<name>-outside". -->
	<div th:fragment="outsideNote(name)" class="form-text text-warning-emphasis" th:id="|${name}-outside|">
		Εκτός λίστας. Μια παλιά τιμή σώζεται όπως είναι· μια νέα πρέπει να είναι της λίστας.</div>
</body>
</html>
