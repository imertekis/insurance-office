<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<body>
	<!-- The single search box (SPEC §6, DECISIONS §3): one input, no type
	     dropdown. On every page, so a search always starts from where the
	     clerk is. Pages include it with
	     <nav th:replace="~{fragments/header :: header('Λήξεις')}"></nav>

	     Task 16b: one row from xl up. Below it, two rows by design: brand and
	     hamburger, then the search at full width, always visible; the menus
	     and the user fold behind the hamburger. The two .header-collapse
	     parts sit either side of the search on desktop, and after it (order-1)
	     on narrower screens. -->
	<th:block th:fragment="header(active)">
	<!-- Task 39b: under the demo profile, a strip above the header of every
	     page, so that a demo opened where it should not be is seen at once. A
	     strip of its own, as a badge beside the brand pushed the hamburger
	     onto a row of its own at 375px. -->
	<div class="text-bg-warning text-center small fw-semibold py-1" th:if="${@environment.matchesProfiles('demo')}"
		id="demo-banner">DEMO · συνθετικά δεδομένα</div>
	<nav class="navbar navbar-expand-xl bg-body-tertiary border-bottom mb-4"
		th:with="expired=${active == 'Λήξεις' and dashboard != null and dashboard.period.expired}">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Ασφαλιστικό Γραφείο</a>
			<!-- Task 16f-1: the theme, outside the hamburger, so it stays in the
			     first row next to it on a phone; last, at the far right, from xl. -->
			<div th:replace="~{fragments/theme-switcher :: switcher('ms-auto me-2 order-xl-last ms-xl-2 me-xl-0')}"></div>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".header-collapse"
				aria-controls="header-menus header-user" aria-expanded="false" aria-label="Μενού">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse header-collapse flex-grow-0 order-1 order-xl-0" id="header-menus">
				<ul class="navbar-nav">
					<!-- The home screen (Task 8) is the renewals to do, 30 days by default. -->
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false"
							th:classappend="${active == 'Λήξεις' or active == 'Συμβόλαια'} ? 'active'">Συμβόλαια</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" th:href="@{/}"
								th:classappend="${active == 'Λήξεις' and !expired} ? 'active'"
								th:attrappend="aria-current=${active == 'Λήξεις' and !expired} ? 'page'">Προς ανανέωση</a></li>
							<li><a class="dropdown-item" th:href="@{/(period='expired')}"
								th:classappend="${expired} ? 'active'"
								th:attrappend="aria-current=${expired} ? 'page'">Ληγμένα</a></li>
							<li><a class="dropdown-item" th:href="@{/policies}"
								th:classappend="${active == 'Συμβόλαια'} ? 'active'"
								th:attrappend="aria-current=${active == 'Συμβόλαια'} ? 'page'">Όλα τα συμβόλαια</a></li>
						</ul>
					</li>
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false"
							th:classappend="${active == 'Πελάτες' or active == 'Νέος πελάτης'} ? 'active'">Πελάτες</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" th:href="@{/customers}"
								th:classappend="${active == 'Πελάτες'} ? 'active'"
								th:attrappend="aria-current=${active == 'Πελάτες'} ? 'page'">Όλοι</a></li>
							<li><a class="dropdown-item" th:href="@{/customers/new}"
								th:classappend="${active == 'Νέος πελάτης'} ? 'active'">Νέος</a></li>
						</ul>
					</li>
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false"
							th:classappend="${active == 'Οχήματα' or active == 'Νέο όχημα'} ? 'active'">Οχήματα</a>
						<ul class="dropdown-menu">
							<li><a class="dropdown-item" th:href="@{/vehicles}"
								th:classappend="${active == 'Οχήματα'} ? 'active'"
								th:attrappend="aria-current=${active == 'Οχήματα'} ? 'page'">Όλα</a></li>
							<li><a class="dropdown-item" th:href="@{/vehicles/new}"
								th:classappend="${active == 'Νέο όχημα'} ? 'active'">Νέο</a></li>
						</ul>
					</li>
				</ul>
			</div>

			<form class="d-flex col-12 col-xl mt-2 mt-xl-0 mx-xl-3" role="search" method="get" th:action="@{/search}">
				<label class="visually-hidden" for="q">Αναζήτηση</label>
				<!-- Task 21b: suggestions while the clerk types, from
				     data-suggestions (Task 21a), in the list under the field:
				     the combobox pattern of WAI-ARIA. app.js fills the list from
				     the templates below, which hold every word and tag of its
				     rows; the suggestions' own texts come from the server.
				     autocomplete="off": the browser's list of past searches
				     would open over ours. -->
				<div class="search-box position-relative flex-grow-1 me-2">
					<input class="form-control" type="search" id="q" name="q"
						placeholder="Πινακίδα, ΑΦΜ, όνομα, email, τηλέφωνο, αρ. συμβολαίου"
						role="combobox" aria-autocomplete="list" aria-expanded="false"
						aria-controls="search-suggestions" autocomplete="off"
						th:data-suggestions="@{/search/suggestions}"
						th:value="${searchQuery}">
					<div class="dropdown-menu search-suggestions" id="search-suggestions" role="listbox"
						aria-label="Προτάσεις αναζήτησης"></div>
				</div>
				<button class="btn btn-outline-primary text-nowrap" type="submit">Αναζήτηση</button>
				<template id="search-suggestions-group">
					<div role="group"><div class="dropdown-header" role="presentation"></div></div>
				</template>
				<!-- The space between the two parts is for screen readers; on
				     screen app.css keeps them apart (a gap, or two lines on a
				     phone). -->
				<template id="search-suggestions-option">
					<a class="dropdown-item search-suggestion" role="option" aria-selected="false"
						tabindex="-1"><span class="search-suggestion-text"></span> <span
						class="search-suggestion-detail"></span></a>
				</template>
				<template id="search-suggestions-all">
					<a class="dropdown-item search-suggestions-all" role="option" aria-selected="false"
						tabindex="-1">Όλα τα αποτελέσματα (<span class="search-suggestions-total"></span>)&nbsp;→</a>
				</template>
				<template id="search-suggestions-none">
					<div class="dropdown-item-text text-body-secondary" role="option"
						aria-disabled="true">Κανένα αποτέλεσμα</div>
				</template>
			</form>

			<!-- Who is logged in, and the way out (SPEC §2). A long name is cut
			     short rather than pushing the header onto a second line. -->
			<div class="collapse navbar-collapse header-collapse flex-grow-0 order-1 order-xl-0" id="header-user"
				th:if="${currentUser != null}">
				<ul class="navbar-nav">
					<li class="nav-item dropdown">
						<a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
							aria-expanded="false" th:title="${currentUser}"><span
								class="d-inline-block text-truncate align-bottom" style="max-width: 12rem"
								th:text="${currentUser}">Χρήστης</span></a>
						<ul class="dropdown-menu dropdown-menu-end">
							<!-- The theme has its own button since Task 16f-1. -->
							<!-- Task 22a: the clerk's own password. -->
							<li><a class="dropdown-item" th:href="@{/account/password}"
								th:classappend="${active == 'Αλλαγή κωδικού'} ? 'active'"
								th:attrappend="aria-current=${active == 'Αλλαγή κωδικού'} ? 'page'">Αλλαγή κωδικού</a></li>
							<li>
								<form method="post" th:action="@{/logout}">
									<button class="dropdown-item" type="submit">Αποσύνδεση</button>
								</form>
							</li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	<!-- Task 16e: the message of the last action, under the header of every
	     page (fragments/flash.html). -->
	<div th:replace="~{fragments/flash :: flash}"></div>
	</th:block>
</body>
</html>
