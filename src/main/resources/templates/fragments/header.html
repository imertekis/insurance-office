<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<body>
	<!-- The single search box (SPEC §6, DECISIONS §3): one input, no type
	     dropdown. On every page, so a search always starts from where the
	     clerk is. Pages include it with
	     <nav th:replace="~{fragments/header :: header('Λήξεις')}"></nav> -->
	<nav th:fragment="header(active)" class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Ασφαλιστικό Γραφείο</a>
			<ul class="navbar-nav me-auto">
				<li class="nav-item">
					<a class="nav-link" th:href="@{/}" th:classappend="${active == 'Λήξεις'} ? 'active'"
						th:attrappend="aria-current=${active == 'Λήξεις'} ? 'page'">Λήξεις</a>
				</li>
				<!-- Task 15: the lists, to browse instead of search. -->
				<li class="nav-item">
					<a class="nav-link" th:href="@{/customers}" th:classappend="${active == 'Πελάτες'} ? 'active'"
						th:attrappend="aria-current=${active == 'Πελάτες'} ? 'page'">Πελάτες</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/vehicles}" th:classappend="${active == 'Οχήματα'} ? 'active'"
						th:attrappend="aria-current=${active == 'Οχήματα'} ? 'page'">Οχήματα</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/policies}" th:classappend="${active == 'Συμβόλαια'} ? 'active'"
						th:attrappend="aria-current=${active == 'Συμβόλαια'} ? 'page'">Συμβόλαια</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/customers/new}"
						th:classappend="${active == 'Νέος πελάτης'} ? 'active'">Νέος πελάτης</a>
				</li>
				<li class="nav-item">
					<a class="nav-link" th:href="@{/vehicles/new}"
						th:classappend="${active == 'Νέο όχημα'} ? 'active'">Νέο όχημα</a>
				</li>
			</ul>
			<form class="d-flex me-3" role="search" method="get" th:action="@{/search}">
				<label class="visually-hidden" for="q">Αναζήτηση</label>
				<input class="form-control me-2" type="search" id="q" name="q" style="min-width: 22rem"
					placeholder="Πινακίδα, ΑΦΜ, όνομα, VIN, τηλέφωνο, αρ. συμβολαίου"
					th:value="${searchQuery}">
				<button class="btn btn-outline-primary" type="submit">Αναζήτηση</button>
			</form>
			<!-- Who is logged in, and the way out (SPEC §2). -->
			<div class="d-flex align-items-center" th:if="${currentUser != null}">
				<span class="navbar-text me-2" th:text="${currentUser}">Χρήστης</span>
				<form method="post" th:action="@{/logout}">
					<button class="btn btn-sm btn-outline-secondary" type="submit">Αποσύνδεση</button>
				</form>
			</div>
		</div>
	</nav>
</body>
</html>
