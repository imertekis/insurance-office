<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Αλλαγή κωδικού')}"></head>
<body>
	<nav th:replace="~{fragments/header :: header('Αλλαγή κωδικού')}"></nav>

	<main class="container">
		<h1 class="h3 mb-3">Αλλαγή κωδικού</h1>

		<!-- Task 22a, decision 1: logged in with a password that no longer
		     meets the rule; every page leads here until it is changed. -->
		<div class="alert alert-warning" th:if="${forced}">Ο κωδικός σας δεν πληροί πλέον τους κανόνες· ορίστε νέο για να συνεχίσετε.</div>

		<!-- The fields are type="password" and never carry a value: a
		     password is not written back into the page, not even after a
		     refused change. Written here rather than with
		     fragments/form-fields, whose fields are all type="text". -->
		<div class="row">
			<div class="col-lg-6">
				<form method="post" th:action="@{/account/password}">
					<section class="card form-section">
						<div class="card-header"><h2>Κωδικός</h2></div>
						<div class="card-body">
							<div class="mb-3">
								<label class="form-label" for="currentPassword">Τρέχων κωδικός</label>
								<input class="form-control" type="password" id="currentPassword" name="currentPassword"
									autocomplete="current-password"
									th:classappend="${errors != null and errors.containsKey('currentPassword')} ? 'is-invalid'">
								<div class="invalid-feedback" th:if="${errors != null and errors.containsKey('currentPassword')}"
									th:text="${errors.get('currentPassword')}">Μήνυμα</div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="newPassword">Νέος κωδικός</label>
								<input class="form-control" type="password" id="newPassword" name="newPassword"
									autocomplete="new-password" aria-describedby="newPassword-hint"
									th:classappend="${errors != null and errors.containsKey('newPassword')} ? 'is-invalid'">
								<div class="invalid-feedback" th:if="${errors != null and errors.containsKey('newPassword')}"
									th:text="${errors.get('newPassword')}">Μήνυμα</div>
								<div class="form-text" id="newPassword-hint">Τουλάχιστον 8 χαρακτήρες, με ένα γράμμα και ένα ψηφίο· τα κενά επιτρέπονται.</div>
							</div>
							<div>
								<label class="form-label" for="newPasswordAgain">Νέος κωδικός ξανά</label>
								<input class="form-control" type="password" id="newPasswordAgain" name="newPasswordAgain"
									autocomplete="new-password"
									th:classappend="${errors != null and errors.containsKey('newPasswordAgain')} ? 'is-invalid'">
								<div class="invalid-feedback" th:if="${errors != null and errors.containsKey('newPasswordAgain')}"
									th:text="${errors.get('newPasswordAgain')}">Μήνυμα</div>
							</div>
						</div>
					</section>

					<div class="d-flex gap-2">
						<button class="btn btn-primary" type="submit">Αλλαγή κωδικού</button>
						<!-- Held here until the change: «Άκυρο» would only lead back. -->
						<a class="btn btn-outline-secondary" th:href="@{/}" th:unless="${forced}">Άκυρο</a>
					</div>
				</form>
			</div>
		</div>
	</main>
</body>
</html>
