<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<!-- The shared <head>. A page includes it with
     <head th:replace="~{layout :: head('Λήξεις')}"></head> -->
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|${title} · Ασφαλιστικό Γραφείο|">Ασφαλιστικό Γραφείο</title>
	<!-- Task 16d-2: the tab icon, local like everything else. The SVG for the
	     browsers that take it, the .ico for the rest; both are allowed
	     before login (SecurityConfig), for the login page. -->
	<link rel="icon" th:href="@{/favicon.ico}" sizes="16x16 32x32 48x48">
	<link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
	<!-- Served from webjars: the office LAN may be offline. -->
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/webjars/flatpickr/dist/flatpickr.min.css}">
	<!-- flatpickr's dark theme is a full copy of its stylesheet, not rules
	     keyed on data-bs-theme, so it stays off (media "not all") until the
	     theme below is dark. Downloaded anyway, so switching is instant. -->
	<link rel="stylesheet" id="flatpickr-dark" media="not all"
		th:href="@{/webjars/flatpickr/dist/themes/dark.css}">
	<!-- Task 16d-1: our own rules, after Bootstrap and flatpickr so they can
	     add to them. Colours only as Bootstrap variables, so they follow the
	     theme below. -->
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<!-- Task 16c: the theme is set here, inline and before <body>, so a dark
	     page is never drawn white first. The choice is the browser's own
	     (localStorage): auto, light or dark; auto follows the OS. The theme
	     lives only in data-bs-theme (and the stylesheet above), so the print
	     styles of Task 16e can force a light page in one place. theme.js
	     reuses window.appTheme for the theme button.
	     Task 16f-1: the choice itself goes on <html> too (data-chosen-theme),
	     so the button shows the right icon from the first paint. Not
	     data-theme-choice: that marks the choice buttons, for theme.js. -->
	<script>
		(function () {
			var choices = ["auto", "light", "dark"];
			var osDark = window.matchMedia("(prefers-color-scheme: dark)");
			function choice() {
				try {
					var stored = window.localStorage.getItem("theme");
					return choices.indexOf(stored) >= 0 ? stored : "auto";
				} catch (e) {
					return "auto";
				}
			}
			function apply(chosen) {
				var theme = chosen === "auto" ? (osDark.matches ? "dark" : "light") : chosen;
				document.documentElement.setAttribute("data-bs-theme", theme);
				document.documentElement.setAttribute("data-chosen-theme", chosen);
				var calendar = document.getElementById("flatpickr-dark");
				if (calendar) {
					calendar.media = theme === "dark" ? "all" : "not all";
				}
			}
			window.appTheme = { choices: choices, osDark: osDark, choice: choice, apply: apply };
			apply(choice());
		})();
	</script>
	<!-- The header's dropdowns and hamburger (Task 16b). With Popper, for
	     the dropdowns; deferred, so it runs once the page is parsed. -->
	<script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
	<script defer th:src="@{/js/theme.js}"></script>
	<!-- Task 16e: the "/" shortcut and the light theme for printing. -->
	<script defer th:src="@{/js/app.js}"></script>
</head>
<body>
	<!-- The navbar with the search box lives in fragments/header.html. -->

	<!-- Task 16a: the dd/MM/yyyy date picker, included at the end of <body>
	     by every form with a date field (customer, vehicle, policy,
	     ownership). Served from the flatpickr webjar, no CDN. -->
	<th:block th:fragment="dateScripts">
		<script th:src="@{/webjars/flatpickr/dist/flatpickr.min.js}"></script>
		<script th:src="@{/webjars/flatpickr/dist/l10n/gr.js}"></script>
		<script th:src="@{/js/date-picker.js}"></script>
	</th:block>
</body>
</html>
