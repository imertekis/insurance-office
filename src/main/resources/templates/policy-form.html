<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Συμβόλαιο')}"></head>
<body>
	<nav th:replace="~{fragments/header :: header('')}"></nav>

	<!-- One field. The error comes from PolicyService, keyed by the DTO field
	     name; what was typed stays in the input. -->
	<div th:fragment="field(name, label, type, value)" class="col-md-4">
		<label class="form-label" th:for="${name}" th:text="${label}">Ετικέτα</label>
		<input class="form-control" th:type="${type}" th:id="${name}" th:name="${name}" th:value="${value}"
			th:classappend="${errors != null and errors.containsKey(name)} ? 'is-invalid'">
		<div class="invalid-feedback" th:if="${errors != null and errors.containsKey(name)}"
			th:text="${errors.get(name)}">Μήνυμα</div>
	</div>

	<main class="container" th:with="p=${policy}, isNew=${policy.id == null}">
		<h1 class="h3 mb-1"
			th:text="${renewalOf != null} ? 'Ανανέωση συμβολαίου' : (${isNew} ? 'Νέο συμβόλαιο' : 'Επεξεργασία συμβολαίου')">Νέο συμβόλαιο</h1>
		<p class="mb-3">
			<a th:href="@{/vehicles/{id}(id=${vehicleId})}" th:text="${plate}">ΑΒΕ1234</a>
			<!-- Task 12: prefilled from the policy being renewed, which stays as
			     history. Only the dates, the number and the premium usually change. -->
			<span th:if="${renewalOf != null}" class="text-body-secondary"
				th:text="|· ανανέωση του ${renewalOf}. Συμπληρώστε νέο αριθμό, τη λήξη και ελέγξτε το ασφάλιστρο.|">· ανανέωση</span>
		</p>

		<div class="alert alert-warning" th:if="${conflict != null}" th:text="${conflict}">Σύγκρουση</div>
		<!-- Whatever concerns the policy as a whole, e.g. an overlap. -->
		<div class="alert alert-danger" th:if="${problems != null and !problems.isEmpty()}">
			<p class="mb-0" th:each="problem : ${problems}" th:text="${problem}">Πρόβλημα</p>
		</div>

		<form method="post" class="row g-3"
			th:action="${isNew} ? @{/vehicles/{id}/policies(id=${vehicleId})} : @{/policies/{id}(id=${p.id})}">
			<!-- Optimistic locking (Task 7): the version the clerk started from. -->
			<input type="hidden" name="version" th:value="${p.version}">
			<input type="hidden" name="id" th:value="${p.id}">
			<input type="hidden" name="vehicleId" th:value="${vehicleId}">
			<input type="hidden" name="renewalOf" th:if="${renewalOf != null}" th:value="${renewalOf}">

			<div th:replace="~{this :: field('policyNumber', 'Αρ. Συμβολαίου *', 'text', ${p.policyNumber})}"></div>

			<!-- Suggestions from the companies on file, so one company is not
			     spelled three ways; a new one can still be typed. -->
			<div class="col-md-4">
				<label class="form-label" for="insuranceCompany">Ασφαλιστική Εταιρεία *</label>
				<input class="form-control" type="text" id="insuranceCompany" name="insuranceCompany"
					list="insurance-companies" th:value="${p.insuranceCompany}"
					th:classappend="${errors != null and errors.containsKey('insuranceCompany')} ? 'is-invalid'">
				<datalist id="insurance-companies">
					<option th:each="company : ${insuranceCompanies}" th:value="${company}"></option>
				</datalist>
				<div class="invalid-feedback" th:if="${errors != null and errors.containsKey('insuranceCompany')}"
					th:text="${errors.get('insuranceCompany')}">Μήνυμα</div>
			</div>

			<!-- Task 11d: existing intermediaries only, never free text. -->
			<div class="col-md-4">
				<label class="form-label" for="intermediaryId">Διαμεσολαβών</label>
				<select class="form-select" id="intermediaryId" name="intermediaryId"
					th:classappend="${errors != null and errors.containsKey('intermediaryId')} ? 'is-invalid'">
					<option value="">—</option>
					<option th:each="intermediary : ${intermediaries}" th:value="${intermediary.id}"
						th:text="${intermediary.fullName}" th:selected="${intermediary.id == p.intermediaryId}">Παπαδόπουλος</option>
				</select>
				<div class="invalid-feedback" th:if="${errors != null and errors.containsKey('intermediaryId')}"
					th:text="${errors.get('intermediaryId')}">Μήνυμα</div>
			</div>

			<div th:replace="~{this :: field('startDate', 'Έναρξη Ασφάλειας *', 'date', ${p.startDate})}"></div>
			<div th:replace="~{this :: field('endDate', 'Λήξη Ασφάλειας *', 'date', ${p.endDate})}"></div>
			<div class="col-md-4">
				<label class="form-label" for="premium">Ασφάλιστρο (€) *</label>
				<input class="form-control" type="text" inputmode="decimal" id="premium" name="premium"
					th:value="${p.premium}" placeholder="π.χ. 180,50"
					th:classappend="${errors != null and errors.containsKey('premium')} ? 'is-invalid'">
				<div class="invalid-feedback" th:if="${errors != null and errors.containsKey('premium')}"
					th:text="${errors.get('premium')}">Μήνυμα</div>
			</div>
			<p class="col-12 text-body-secondary small mb-0">
				Η λήξη δεν υπολογίζεται: υπάρχουν εξάμηνα και ετήσια συμβόλαια. Ένα συμβόλαιο μπορεί να αρχίζει
				την ημέρα που λήγει το προηγούμενο.
			</p>

			<div class="col-md-4 d-flex align-items-end">
				<div class="form-check">
					<input class="form-check-input" type="checkbox" id="surcharge" name="surcharge" value="true"
						th:checked="${p.surcharge == true}">
					<label class="form-check-label" for="surcharge">Επασφάλιστρο</label>
				</div>
			</div>
			<div class="col-md-4">
				<label class="form-label" for="surchargeType">Τύπος επασφαλίστρου</label>
				<select class="form-select" id="surchargeType" name="surchargeType"
					th:classappend="${errors != null and errors.containsKey('surchargeType')} ? 'is-invalid'">
					<option value="">—</option>
					<option th:each="type : ${surchargeTypes}" th:value="${type}" th:text="${type}"
						th:selected="${type.name() == p.surchargeType}">ΝΕΟΣ_ΟΔΗΓΟΣ</option>
				</select>
				<div class="invalid-feedback" th:if="${errors != null and errors.containsKey('surchargeType')}"
					th:text="${errors.get('surchargeType')}">Μήνυμα</div>
			</div>

			<div class="col-12 d-flex gap-2">
				<button class="btn btn-primary" type="submit">Αποθήκευση</button>
				<a class="btn btn-outline-secondary" th:href="@{/vehicles/{id}(id=${vehicleId})}">Άκυρο</a>
			</div>
		</form>
	</main>
</body>
</html>
